<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clinical Guidelines Library</title>
  <meta name="description" content="Clinical practice guidelines from major medical societies and WHO, updated automatically.">
  <meta name="theme-color" content="#2e6b64">
  <link rel="alternate" type="application/rss+xml" title="New guidelines" href="feed.xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><a href="#/">Guidelines Library</a></h1>
      <label class="search">
        <span class="visually-hidden">Search</span>
        <input id="q" type="search" placeholder="Disease, specialty, society" autocomplete="off">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <div class="wrap">
      <a href="#/" data-tab="diseases" class="tab">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>All Diseases</span>
      </a>
      <a href="#/specialties" data-tab="specialties" class="tab">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-3"/><circle cx="20" cy="11" r="2"/></svg>
        <span>Specialties</span>
      </a>
    </div>
  </nav>

  <main class="wrap" id="view" aria-live="polite">
    <p class="empty">Loading guidelines…</p>
  </main>

  <footer class="wrap foot">
    <p id="meta"></p>
    <p><a href="#/sources">Sources and coverage</a> · <a href="#/recent">Recently added</a> · <a href="feed.xml">RSS feed</a></p>
    <p class="note">Links go to the publisher or PubMed record. Always confirm the current version with the issuing organization.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
