# Condition dictionary used to tag guidelines.
#
# A guideline is tagged with a condition when any `match` phrase appears in
# its title, MeSH headings or keywords (case-insensitive, whole words;
# regular expressions are allowed). The condition's specialty is added to the
# guideline's specialties, so NICE and WHO guidelines land under the right
# specialty too. Guidelines matching nothing appear under "Other guidelines".
#
# Add a condition by copying an entry. Keep names as they should be shown.

