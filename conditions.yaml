# Condition dictionary used to tag guidelines.
#
# A guideline is tagged with a condition when any `match` phrase appears in
# its title, major-topic MeSH headings or keywords (case-insensitive, whole
# words; regular expressions are allowed). The condition's specialty is its
# home: it is added to the guideline, and the specialty page lists the
# condition only under that home specialty. A guideline that matches several
# conditions does not file the other diseases under this one. Guidelines
# matching nothing appear under "Other guidelines".
#
# Add a condition by copying an entry. Keep names as they should be shown.

