name: Refresh guidelines

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "sources.yaml", "conditions.yaml", "scripts/**"]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch guidelines from society sources
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
        run: |
          set -o pipefail
          python scripts/build_data.py | tee build.log
          { echo '### Source report'; echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "guidelines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/guidelines.json site/feed.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh guideline data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
