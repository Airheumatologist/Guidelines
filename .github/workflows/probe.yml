name: Probe society pages
on:
  pull_request:
    paths: ["scripts/probe.py", "scripts/probe_urls.txt"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe.py scripts/probe_urls.txt
