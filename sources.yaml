    pubmed:
      query: '("J Allergy Clin Immunol"[ta] OR "Ann Allergy Asthma Immunol"[ta] OR "J Allergy Clin Immunol Pract"[ta] OR "J Allergy Clin Immunol Glob"[ta]) AND ("practice parameter"[ti] OR "Joint Task Force"[ti] OR ((guideline*[ti] OR statement*[ti] OR consensus[ti] OR "work group report"[ti]) AND (AAAAI[ti] OR ACAAI[ti] OR "American Academy of Allergy"[ti] OR "American College of Allergy"[ti])))'

