# Curated guideline sources.
#
# Edit this file to add, remove or tune organizations. Every scheduled run of
# scripts/build_data.py reads it and rebuilds site/data/guidelines.json.
#
# Each source has:
#   id:          short unique key (lowercase, no spaces)
#   name:        full organization name shown in the app
#   abbr:        badge text shown next to each guideline
#   specialty:   default specialty, or "multi" when the organization spans
#                specialties (specialty then comes from conditions.yaml only)
#   enabled:     set to false to switch a source off without deleting it
#   pubmed:      how to find this organization's guidelines in PubMed
#                (NCBI E-utilities). Either:
#                  journals:    NLM journal title abbreviations ([ta])
#                  title_terms: organization names/acronyms that must appear in
#                               the title (or as corporate author [cn])
#                and/or a raw `query` that replaces the generated one.
#                Generated query =
#                  (guideline*, recommendation*, consensus, statement*,
#                   advisory, position paper, points to consider,
#                   classification criteria, technical standard, care/decision
#                   pathway, practice update, practice parameter in the title,
#                   or a guideline / consensus statement publication type)
#                  AND (title_terms[ti] OR title_terms[cn])  -- if given
#                  AND (journals[ta])                        -- if given
#                allow_pubtypes: publication types to keep although they are
#                               excluded by default (e.g. letter, comment for
#                               ACP's living-guideline update alerts).
#   rss:         optional list of the organization's own RSS/Atom feeds.
#                Items are kept only if their title matches `rss_keywords`.
#   web:         optional list of the organization's own guideline or press
#                pages, for guidelines released before any journal paper:
#                  url:          the page to read
#                  link_pattern: regex the guideline links must match
#                  keywords:     regex the link text must match (default:
#                                rss_keywords)
#                  strip:        regex removed from the link text (dates, labels)
#                  follow:       true to open each link and use its own title/date
#                Website items are dropped automatically once the guideline is
#                indexed in PubMed.
#
# Records found by more than one source (same DOI or title) are merged.

settings:
  since_year: 2018          # oldest publication year to include
  max_per_source: 1000      # cap on PubMed records per source per run (newest first)
  rss_keywords:             # an RSS item must match one of these (case-insensitive)
    - guideline
    - recommendation
    - guidance
    - consensus statement
    - practice parameter
    - standards of care
    - scientific statement
  exclude_title_patterns:   # dropped wherever they come from
    - '^correction'
    - '^erratum'
    - '^corrigendum'
    - 'retraction'
    - '^reply'
    - '^response to'
    - '^comment on'
    - 'correction$'
    - 'systematic review'
    - 'meta-analysis'
    - 'implementation of'
    - 'quality indicators'
    - 'operating procedures'
    - 'guideline development'
    - 'concerns about'
    - 'rethinking'
    - '^visual guideline'
    - '^study on'
    - 'a guide to the'
    - "what is new in"

sources:
  # ---------------------------------------------------------------- Global
  - id: who
    name: World Health Organization
    abbr: WHO
    specialty: multi
    pubmed:
      query: '("World Health Organization"[pubn] OR "World Health Organization"[cn]) AND (guideline*[ti] OR recommendation*[ti])'
    web:
      - url: https://www.who.int/publications/who-guidelines
        link_pattern: 'iris\.who\.int/handle/|who\.int/publications/i/item/'
        keywords: 'guideline|recommendation|position paper'

  - id: nice
    name: National Institute for Health and Care Excellence
    abbr: NICE
    specialty: multi
    pubmed:
      # NICE's Bookshelf also holds evidence reviews, appendices and technology appraisals; keep the clinical guidelines only.
      query: '("National Institute for Health and Care Excellence"[pubn] OR "National Institute for Health and Care Excellence"[cn]) NOT ("evidence review"[ti] OR "evidence reviews"[ti] OR appendix[ti] OR appendices[ti] OR "economic"[ti] OR "methods"[ti] OR "supplement"[ti] OR "committee"[ti] OR "for treating"[ti] OR "for untreated"[ti] OR "for previously treated"[ti] OR "terminated appraisal"[ti])'

  - id: uspstf
    name: US Preventive Services Task Force
    abbr: USPSTF
    specialty: Preventive Medicine
    pubmed:
      query: '"JAMA"[ta] AND "Preventive Services Task Force"[ti] AND "recommendation statement"[ti]'

  # ---------------------------------------------------------- Rheumatology
  - id: acr
    name: American College of Rheumatology
    abbr: ACR
    specialty: Rheumatology
    pubmed:
      journals: ["Arthritis Rheumatol", "Arthritis Care Res (Hoboken)", "Ann Rheum Dis"]
      title_terms: ["American College of Rheumatology", "ACR"]
    web:
      # Guidelines are announced here (and posted as summaries) months before the journal paper.
      - url: https://rheumatology.org/press-releases
        link_pattern: 'rheumatology\.org/press-releases/'
        keywords: 'guideline|guidance|recommendation'
        strip: '^\d{1,2}/\d{1,2}/\d{2,4}|(ACR News|Clinical Practice Guidelines|Press Release).*$'
        follow: true

  - id: eular
    name: European Alliance of Associations for Rheumatology
    abbr: EULAR
    specialty: Rheumatology
    pubmed:
      journals: ["Ann Rheum Dis", "RMD Open", "Arthritis Rheumatol"]
      title_terms: ["EULAR", "ASAS-EULAR"]

  # ------------------------------------------------------------ Cardiology
  - id: aha-acc
    name: American Heart Association / American College of Cardiology
    abbr: AHA/ACC
    specialty: Cardiology
    pubmed:
      journals: ["Circulation", "J Am Coll Cardiol", "Hypertension", "Stroke", "J Am Heart Assoc",
                 "Circ Heart Fail", "Circ Cardiovasc Qual Outcomes", "Circ Genom Precis Med",
                 "Circ Popul Health Outcomes", "Circ Arrhythm Electrophysiol", "Circ Cardiovasc Interv",
                 "Circ Cardiovasc Imaging", "Arterioscler Thromb Vasc Biol", "Heart Rhythm",
                 "JACC Adv", "JACC Heart Fail", "JACC Cardiovasc Interv", "JACC Cardiovasc Imaging"]
      title_terms: ["American Heart Association", "American College of Cardiology", "AHA", "ACC", "American Stroke Association"]
    web:
      # ACC lists its guidelines, decision pathways and statements with JACC DOI links.
      - url: https://www.acc.org/guidelines
        link_pattern: 'jacc\.org/doi/10\.'
        keywords: '.'
        strip: '^(Guidelines|Expert Consensus Decision Pathways|Scientific Statements|Health Policy Statements|Appropriate Use Criteria|Performance Measures)\s+(\d{4}\s+)?|\[Reaffirmed\]|Go to .*$|Read the \d{4} Guideline'
    rss:
      - https://www.ahajournals.org/action/showFeed?type=axatoc&feed=rss&jc=circ   # Circulation, ahead of print

  - id: esc
    name: European Society of Cardiology
    abbr: ESC
    specialty: Cardiology
    pubmed:
      journals: ["Eur Heart J", "Eur J Heart Fail", "ESC Heart Fail", "Eur Heart J Acute Cardiovasc Care",
                 "Eur J Prev Cardiol", "Europace", "Eur Heart J Cardiovasc Imaging", "EuroIntervention",
                 "Eur J Cardiothorac Surg", "Eur Heart J Cardiovasc Pharmacother",
                 "Eur Heart J Qual Care Clin Outcomes", "Eur Heart J Digit Health", "Cardiovasc Res"]
      title_terms: ["ESC", "European Society of Cardiology", "Heart Failure Association", "EHRA", "EAPCI", "EACVI", "EAPC"]

  # ---------------------------------------------------------- Endocrinology
  - id: ada
    name: American Diabetes Association
    abbr: ADA
    specialty: Endocrinology
    pubmed:
