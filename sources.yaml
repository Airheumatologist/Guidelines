  # ---------------------------------------------------------- Critical care
  - id: sccm
    name: Society of Critical Care Medicine / Surviving Sepsis Campaign
    abbr: SCCM
    specialty: Critical Care
    pubmed:
      # SCCM's own journals: guideline titles there rarely repeat the society name.
      query: '(("Crit Care Med"[ta] OR "Pediatr Crit Care Med"[ta] OR "Crit Care Explor"[ta]) AND (guideline*[ti] OR "practice guideline"[pt] OR "consensus statement"[pt] OR statement[ti])) OR (("Intensive Care Med"[ta] OR "Crit Care Med"[ta] OR "Pediatr Crit Care Med"[ta]) AND ("Surviving Sepsis Campaign"[ti] OR "Society of Critical Care Medicine"[ti]))'

